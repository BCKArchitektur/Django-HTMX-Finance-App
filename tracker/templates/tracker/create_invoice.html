<div id="invoiceModal" class="modal">
  <div class="modal-box max-w-[1200px] w-full relative">
    <!-- Schließen -->
    <button class="btn btn-sm btn-circle btn-ghost absolute top-2 right-2" onclick="closeInvoiceModal()">✕</button>

    <!-- Kumulationsmodus -->
    <div class="absolute top-3 right-14">
      <label class="cursor-pointer flex items-center">
        <span class="mr-2 font-extralight text-xs">Kumulationsmodus</span>
        <input type="checkbox" id="cummulationModeSwitch" class="toggle toggle-primary" onchange="toggleCummulationMode()">
      </label>
    </div>

    <h3 class="font-bold text-lg m-4">Neue Rechnung erstellen</h3>

    <form id="invoice-form" method="post" action="{% url 'create_invoice' project.id %}">
      {% csrf_token %}

      <!-- Hidden kumulativ -->
      <input type="hidden" id="is_cumulative" name="is_cumulative" value="false">

      <!-- Projekt -->
      <div class="form-control">
        <label class="label">Projekt</label>
        <input type="text" class="input input-bordered w-full" value="{{ project.project_name }}" disabled>
      </div>

      <!-- Vertrag -->
      <div class="form-control">
        <label class="label">Vertrag</label>
        <select id="id_contract" name="contract" class="select select-bordered w-full">
          <option value="">Vertrag auswählen</option>
          {% for contract in contracts %}
            <option value="{{ contract.id }}">{{ contract.contract_name }}</option>
          {% endfor %}
        </select>
      </div>

      <!-- Rechnungstyp -->
      <div class="form-control">
        <label class="label">Rechnungstyp</label>
        <select id="id_invoice_type" name="invoice_type" class="select select-bordered w-full">
          <option value="ER">Einzelrechnung</option>
          <option value="ZR">Anzahlungsrechnung</option>
        </select>
      </div>

      <!-- === START: Zweispaltiges Layout (left wide, right cards pinned right) === -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">

        <!-- LINKE SPALTE: Mengen + obere Karte (volle Breite) -->
        <div class="md:col-span-2">
          <!-- Gelieferte Mengen -->
          <div class="form-control">
            <label class="label">Gelieferte Mengen</label>
            <textarea name="provided_quantities" class="textarea textarea-bordered w-full" hidden>{{ form.initial.provided_quantities }}</textarea>
            <div id="provided-quantities-table"></div>
          </div>

          <!-- Obere Berechnung -->
          <div class="card bg-base-100 mt-4 w-full">
            <div class="card-body p-4">
              <h4 class="font-semibold mb-2">Berechnung (Gesamt)</h4>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <label class="flex items-center justify-end gap-4">
                  <span class="text-sm text-zinc-600">Zwischensumme Positionen €</span>
                  <input type="text" id="id_sum_of_items" class="input input-bordered input-sm w-48 text-right" readonly>
                </label>

                <label class="flex items-center justify-end gap-4">
                  <span class="text-sm text-zinc-600">Nebenkosten %</span>
                  <input type="text" id="id_additional_fee_percentage" class="input input-bordered input-sm w-48 text-right" readonly value="{{ additional_fee_percentage }}">
                </label>

                <label class="flex items-center justify-end gap-4">
                  <span class="text-sm text-zinc-600">Nebenkosten €</span>
                  <input type="text" id="id_additional_fee" class="input input-bordered input-sm w-48 text-right" readonly>
                </label>

                <label class="flex items-center justify-end gap-4">
                  <span class="text-sm text-zinc-600">Nachlass %</span>
                  <input type="text" id="id_nachlass_percentage" class="input input-bordered input-sm w-48 text-right" readonly>
                </label>

                <label class="flex items-center justify-end gap-4">
                  <span class="text-sm text-zinc-600">Nachlass €</span>
                  <input type="text" id="id_nachlass_value" class="input input-bordered input-sm w-48 text-right" readonly>
                </label>

                <label class="flex items-center justify-end gap-4">
                  <span class="font-semibold">Rechnungs-Netto €</span>
                  <input type="text" id="id_invoice_net" name="invoice_net" class="input input-bordered input-sm w-48 text-right" readonly>
                </label>

                <label class="flex items-center justify-end gap-4">
                  <span class="text-sm text-zinc-600">USt(%)</span>
                  <input type="text" id="vat_percentage" class="input input-bordered input-sm w-48 text-right" readonly>
                </label>

                <label class="flex items-center justify-end gap-4">
                  <span class="text-sm text-zinc-600">USt €</span>
                  <input type="text" id="id_vat" class="input input-bordered input-sm w-48 text-right" readonly>
                </label>

                <label class="sm:col-span-2 flex items-center justify-end gap-4">
                  <span class="font-semibold">Rechnungs-Brutto €</span>
                  <input type="text" id="id_gross_invoice" class="input input-bordered input-sm w-48 text-right" readonly>
                </label>
              </div>
            </div>
          </div>
        </div>


 

        <!-- RECHTE SPALTE: Ganze Reihe, Inhalt an rechten Rand schieben -->
        <div class="md:col-span-2">
          <div class="md:flex md:justify-end">
            <!-- feste Maxbreite rechts; auf Mobile volle Breite -->
            <div class="space-y-4 w-full md:max-w-[900px]">
              <div class="card bg-base-100  w-full">
                <div class="card-body p-4">
                  <h4 class="font-semibold mb-2">Frühere Rechnungen</h4>
                  <div id="prev-invoices"></div>
                </div>
              </div>

<div class="divider"></div>


<div class="card bg-base-100 w-full">
  <div class="card-body p-4">
    <h4 class="font-semibold mb-1">Aktuelle Rechnungsdetails (berechnet)</h4>
    <div class="text-xs text-zinc-500 mb-3" id="current-mode-label"></div>

    <div class="flex justify-end text-sm">
      <span>Aktuell Rechnungs-Netto €</span>
      <span id="current_net" class="text-right w-24">0,00</span>
    </div>
    <div class="flex justify-end text-sm">
      <span>USt €</span>
      <span id="current_tax" class="text-right w-24">0,00</span>
    </div>
    <div class="flex justify-end font-semibold">
      <span>Aktuell Rechnungs-Brutto €</span>
      <span id="current_gross" class="text-right w-24">0,00</span>
    </div>
  </div>
</div>



            </div>
          </div>
        </div>

      </div>
      <!-- === END: Zweispaltiges Layout === -->


      <!-- Aktionen -->
      <div class="modal-action">
        <button type="submit" class="btn btn-primary btn-outline">Rechnung erstellen</button>
        <a href="#" class="btn" onclick="closeInvoiceModal()">Abbrechen</a>
      </div>
    </form>
  </div>
</div>

<script>
/* ===== Umschalten Kumulationsmodus ===== */
function toggleCummulationMode() {
  const isChecked = document.getElementById('cummulationModeSwitch').checked;
  const invoiceTypeSelect = document.getElementById('id_invoice_type');
  const isCumulativeInput = document.getElementById('is_cumulative');

  isCumulativeInput.value = isChecked ? "true" : "false";
  invoiceTypeSelect.innerHTML = '';

  if (isChecked) {
    invoiceTypeSelect.innerHTML += `
      <option value="AR">Abschlagsrechnung</option>
      <option value="SR">Schlussrechnung</option>
      <option value="ZR">Anzahlungsrechnung</option>
    `;
  } else {
    invoiceTypeSelect.innerHTML += `
      <option value="ER">Einzelrechnung</option>
      <option value="ZR">Anzahlungsrechnung</option>
    `;
  }
}

function openInvoiceModal() {
  document.getElementById('provided-quantities-table').innerHTML = '';
  document.getElementById('invoiceModal').classList.add('modal-open');
}
function closeInvoiceModal() {
  const invoiceForm = document.querySelector('#invoice-form');
  if (invoiceForm) invoiceForm.reset();
  document.getElementById('provided-quantities-table').innerHTML = '';
  document.getElementById('invoiceModal').classList.remove('modal-open');
}

/* ===== Zahlen-Helfer: akzeptiert Komma oder Punkt ===== */
function __fmtDE(n) {
  const num = Number(n || 0);
  return num.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function __parseFlex(v) {
  if (v == null) return 0;
  let s = String(v).trim().replace(/\s+/g, '');
  if (s === '') return 0;
  const hasComma = s.includes(',');
  const hasDot = s.includes('.');
  if (hasComma && hasDot) {
    s = s.replace(/\./g, '').replace(',', '.');
    return parseFloat(s);
  }
  if (hasComma) return parseFloat(s.replace(',', '.'));
  return parseFloat(s);
}

/* ===== Rechte Karten ===== */
function __renderPrevInvoices(list) {
  const target = document.getElementById('prev-invoices');
  if (!list || !list.length) {
    target.innerHTML = '<div class="text-sm text-zinc-500">Keine früheren Rechnungen.</div>';
    return;
  }
  let html = `
    <table class="table table-zebra w-full text-xs">
      <thead>
        <tr>
          <th>#</th>
          <th>Titel</th>
          <th>Datum</th>
          <th class="text-right">Netto</th>
          <th class="text-right">Steuer</th>
          <th class="text-right">Brutto</th>
        </tr>
      </thead>
      <tbody>
  `;
  list.forEach((inv, idx) => {
    html += `
      <tr>
        <td>${idx + 1}</td>
        <td>
          ${inv.title}
          <span class="badge badge-primary badge-sm ml-2">
            ${inv.invoice_type}
            ${inv.invoice_type === 'AR' && inv.current_ar_number ? '.' + inv.current_ar_number : ''}
            ${inv.is_cumulative ? ', kum.' : ''}
          </span>
        </td>

        <td>${inv.created_at}</td>
        <td class="text-right">${__fmtDE(inv.net)}</td>
        <td class="text-right">${__fmtDE(inv.tax)}</td>
        <td class="text-right">${__fmtDE(inv.gross)}</td>
      </tr>`;
  });
  html += '</tbody></table>';
  target.innerHTML = html;
}

/* ===== Aktuell (Delta) berechnen ===== */
let __sumPrevCurrentNet = 0;
let __isCumulative = false;

function __recalcCurrentFromTotals() {
  const totalNetDisplayed = __parseFlex(document.getElementById('id_invoice_net')?.value || 0);
  const vatPct = __parseFlex(document.getElementById('vat_percentage')?.value || 0);

  let currentNet = totalNetDisplayed;
  if (__isCumulative) {
    currentNet = totalNetDisplayed - __sumPrevCurrentNet;
  }
  if (!isFinite(currentNet)) currentNet = 0;
  if (currentNet < 0) currentNet = 0;

  const currentTax = currentNet * (vatPct / 100.0);
  const currentGross = currentNet + currentTax;

  document.getElementById('current-mode-label').textContent =
    __isCumulative
      ? 'Kumulationsmodus: Aktuell = Gesamt-Netto – Summe (vorherige aktuelle Netto)'
      : 'Normalmodus: Aktuell = Gesamt-Netto';

  document.getElementById('current_net').textContent = __fmtDE(currentNet);
  document.getElementById('current_tax').textContent = __fmtDE(currentTax);
  document.getElementById('current_gross').textContent = __fmtDE(currentGross);
}

/* Originale calculateInvoiceNet einhaken (nicht entfernen) */
(function () {
  const oldCalc = window.calculateInvoiceNet;
  window.calculateInvoiceNet = function () {
    if (typeof oldCalc === 'function') oldCalc.apply(this, arguments);
    __recalcCurrentFromTotals();
  };
})();

/* ===== Laden/Binden ===== */
document.addEventListener('DOMContentLoaded', function() {
  const contractField = document.querySelector('#id_contract');
  const isCumulativeInput = document.getElementById('is_cumulative');

  if (contractField) {
    contractField.addEventListener('change', function() {
      const contractId = this.value;
      if (contractId) {
        fetch(`/ajax/load-contract-data/?contract_id=${contractId}`)
          .then(r => r.json())
          .then(data => {
            document.getElementById('id_additional_fee_percentage').value = data.additional_fee_percentage || 0;
            document.getElementById('vat_percentage').value = data.vat_percentage || 0;
            document.getElementById('id_nachlass_value').value = data.nachlass_value || 0;
            document.getElementById('id_nachlass_percentage').value = data.nachlass_percentage || 0;

            const isCumulative = data.is_cumulative;
            isCumulativeInput.value = isCumulative ? "true" : "false";

            __renderPrevInvoices(data.previous_invoices || []);
            __sumPrevCurrentNet = Number(data.sum_previous_current_net || 0);
            __isCumulative = !!data.is_cumulative;

            // Tabelle mit Sektionen/Positionen
            let html = '<table class="table w-full">';
            html += '<thead><tr><th>Nr.</th><th>Wahl</th><th>Sektion & Position</th><th>Satz</th><th>Std. erfasst</th><th>Menge (angeboten)</th><th>Menge (verfügbar)</th><th>Menge (bereitgestellt)</th><th>Summe</th></tr></thead>';
            html += '<tbody>';

            data.sections.forEach((section, sIdx) => {
              const sectionId = section.id;
              const excludeNachlass = section.exclude_from_nachlass;

              html += `<tr>
                <td colspan="9" class="font-bold bg-base-100 text-sm text-zinc-700 px-4 py-2">
                  <div class="flex justify-between items-center">
                    <span>${sIdx + 1}. ${section.section_name}</span>
                    ${excludeNachlass ? '<span class="text-xs font-thin text-rose-600 bg-rose-100 border border-rose-200 rounded-md px-2 py-1">Vom Nachlass ausgenommen</span>' : ''}
                  </div>
                  <input type="hidden" class="section-metadata" data-section-id="${sectionId}" data-exclude-nachlass="${excludeNachlass}">
                </td>
              </tr>`;

              section.items.forEach((item, iIdx) => {
                const quotedQuantity = item.quantity;
                const availableQuantity = item.available_quantity;
                const previousProvidedQuantity = item.previous_provided_quantity || 0;

                let isChecked = ((quotedQuantity > availableQuantity) && (availableQuantity >= 0));
                if (section.section_name.includes("LP")) isChecked = true;

                const qtyClass = availableQuantity > 0 ? 'text-green-600' : 'text-red-500';
                const hoursLogged = item.hours_logged || 0;
                const hoursClass = hoursLogged <= quotedQuantity ? 'text-green-600' : 'text-red-500';

                html += `<tr>
                  <td>${sIdx + 1},${iIdx + 1}</td>
                  <td><input type="checkbox" name="select_${item.id}" ${isChecked ? 'checked="checked"' : ''} data-item-id="${item.id}" class="checkbox checkbox-primary" /></td>
                  <td class="pl-8">${item.Item_name}</td>
                  <td>${item.rate}</td>
                  <td class="${hoursClass}">${Number(hoursLogged).toFixed(2)}</td>
                  <td>${quotedQuantity}(${item.unit})</td>
                  <td class="${qtyClass}">${availableQuantity}</td>
                  <td>
                    <input type="text" name="quantity_${item.id}" class="input input-bordered"
                      data-item-id="${item.id}"
                      data-item-rate="${item.rate}"
                      data-item-unit="${item.unit}"
                      onchange="updateTotalInvoice(${item.id})"
                      value="${isCumulative ? previousProvidedQuantity : ''}"
                      placeholder="${isCumulative ? previousProvidedQuantity : ''}"
                      ${isChecked ? '' : 'disabled'} />
                  </td>
                  <td id="total_${item.id}">0.00</td>
                </tr>`;
              });
            });

            html += '</tbody></table>';
            document.getElementById('provided-quantities-table').innerHTML = html;

            // Events pro Zeile
            document.querySelectorAll('#provided-quantities-table .checkbox').forEach(cb => {
              const itemId = cb.dataset.itemId;
              const qtyInput = document.querySelector(`#provided-quantities-table input[name="quantity_${itemId}"]`);
              cb.addEventListener('change', function () {
                if (this.checked) qtyInput.disabled = false;
                else { qtyInput.value = ''; qtyInput.disabled = true; }
                calculateInvoiceNet();
              });
              qtyInput.addEventListener('input', function () { calculateInvoiceNet(); });
            });

            calculateInvoiceNet();
          })
          .catch(err => console.error('Fehler beim Laden der Vertragsdaten:', err));
      } else {
        document.getElementById('provided-quantities-table').innerHTML = '';
        document.getElementById('id_additional_fee_percentage').value = 0;
        document.getElementById('vat_percentage').value = 0;
        calculateInvoiceNet();
      }
    });
  }

  // Form: Zahlen mit Komma/Punkt speichern
  const invoiceForm = document.querySelector('#invoice-form');
  if (invoiceForm) {
    invoiceForm.addEventListener('submit', function() {
      const quantities = {};
      document.querySelectorAll('input[name^="quantity_"]').forEach(input => {
        const row = input.closest('tr');
        const checkbox = row.querySelector('input[name^="select_"]');
        if (checkbox && checkbox.checked) {
          const quantity = __parseFlex(input.value || 0) || 0;
          const rate = __parseFlex(input.dataset.itemRate) || 0;
          quantities[input.dataset.itemId] = { quantity, rate };
        }
      });
      document.querySelector('textarea[name="provided_quantities"]').value = JSON.stringify(quantities);
    });
  }
});

/* Ersten Modus fixieren bei bestehender Rechnung */
document.addEventListener('DOMContentLoaded', function () {
  const contractField = document.querySelector('#id_contract');
  const cummulationModeSwitch = document.getElementById('cummulationModeSwitch');
  const isCumulativeInput = document.getElementById('is_cumulative');

  if (contractField) {
    contractField.addEventListener('change', function () {
      const contractId = this.value;
      if (contractId) {
        fetch(`/ajax/get-first-invoice-mode/?contract_id=${contractId}`)
          .then(r => r.json())
          .then(data => {
            if (data.first_invoice_exists) {
              isCumulativeInput.value = data.is_cumulative ? "true" : "false";
              cummulationModeSwitch.checked = data.is_cumulative;
              cummulationModeSwitch.disabled = true;
            } else {
              cummulationModeSwitch.disabled = false;
            }
            toggleCummulationMode();
          })
          .catch(err => console.error('Fehler beim Prüfen des ersten Modus:', err));
      }
    });
  }

  // Sanfte Eingabeprüfung + Sync
  let quantityAlertTimeout = null;
  function validateQuantityInput(input) {
    if (!input.closest("#invoiceModal")) return;
    clearTimeout(quantityAlertTimeout);

    const prevProvided = parseFloat(input.placeholder) || 0;
    const quotedCell = input.closest('tr').querySelector('td:nth-child(6)');
    const quotedText = quotedCell ? quotedCell.textContent : '0';
    const quoted = __parseFlex(quotedText);
    let entered = __parseFlex(input.value);

    quantityAlertTimeout = setTimeout(() => {
      if (entered < prevProvided || entered > quoted) input.classList.add("input-error");
      else input.classList.remove("input-error");
      updateTotalInvoice(input.dataset.itemId);
      __recalcCurrentFromTotals();
    }, 100);
  }

  document.addEventListener('input', function (e) {
    if (e.target.matches('input[name^="quantity_"]')) validateQuantityInput(e.target);
  });

  ['id_invoice_net','vat_percentage'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('input', __recalcCurrentFromTotals);
  });
});
</script>
